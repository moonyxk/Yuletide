name: Build and tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build (Minecraft ${{ matrix.minecraft_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft_version: '26.1.2'
            fabric_api_version: '0.155.3+26.1.2'
          - minecraft_version: '26.2'
            fabric_api_version: '0.161.0+26.2'
          - minecraft_version: '26.3'
            fabric_api_version: '0.166.2+26.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run tests
        run: |
          bash ./gradlew --no-daemon build \
            -Pminecraft_version='${{ matrix.minecraft_version }}' \
            -Pfabric_api_version='${{ matrix.fabric_api_version }}'
