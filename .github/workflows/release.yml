name: Release

on:
  push:
    branches: [main]
    paths: [gradle.properties]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      archive: ${{ steps.version.outputs.archive }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect mod version change
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        shell: python
        run: |
          import os
          import re
          import subprocess
          from pathlib import Path

          def property_value(content, key):
              for line in content.splitlines():
                  name, separator, value = line.partition("=")
                  if separator and name.strip() == key:
                      return value.strip()
              return ""

          current = Path("gradle.properties").read_text()
          previous = ""
          before = os.environ["BEFORE"]
          if before != "0" * 40:
              exists = subprocess.run(
                  ["git", "cat-file", "-e", f"{before}:gradle.properties"],
                  capture_output=True,
              )
              if exists.returncode == 0:
                  previous = subprocess.check_output(
                      ["git", "show", f"{before}:gradle.properties"], text=True
                  )

          version = property_value(current, "mod_version")
          archive = property_value(current, "archives_base_name")
          for value in (version, archive):
              if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._+-]*", value):
                  raise ValueError(f"Invalid version or archive name: {value!r}")

          changed = version != property_value(previous, "mod_version")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"changed={str(changed).lower()}\n")
              output.write(f"version={version}\n")
              output.write(f"archive={archive}\n")

  build:
    needs: version
    if: needs.version.outputs.changed == 'true'
    name: Build (Minecraft ${{ matrix.minecraft_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft_version: '26.1.2'
            fabric_api_version: '0.155.3+26.1.2'
          - minecraft_version: '26.2'
            fabric_api_version: '0.161.0+26.2'
          - minecraft_version: '26.3'
            fabric_api_version: '0.166.2+26.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests and build
        run: |
          ./gradlew --no-daemon test build \
            -Pminecraft_version='${{ matrix.minecraft_version }}' \
            -Pfabric_api_version='${{ matrix.fabric_api_version }}' \
            -Parchives_base_name='${{ needs.version.outputs.archive }}-mc-${{ matrix.minecraft_version }}'
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.minecraft_version }}
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: release-jar-${{ matrix.minecraft_version }}
          path: build/libs/${{ needs.version.outputs.archive }}-mc-${{ matrix.minecraft_version }}-${{ needs.version.outputs.version }}.jar
          if-no-files-found: error

  publish:
    needs: [version, build]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-jar-*
          path: release-artifacts
          merge-multiple: true
      - name: Publish release with mod JARs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          test "$(find release-artifacts -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 3
          gh release create "v$VERSION" release-artifacts/*.jar \
            --target "$GITHUB_SHA" \
            --title "Yuletide $VERSION" \
            --generate-notes
